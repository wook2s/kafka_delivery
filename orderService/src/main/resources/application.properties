spring.application.name=orderService

# ===========================
# MariaDB
# ===========================
spring.datasource.url=jdbc:mariadb://localhost:33060/delivery
spring.datasource.username=delivery
spring.datasource.password=delivery1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ===========================
# JPA
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# =======================================================
# Kafka
# =======================================================
# 1. 카프카 브로커 주소 (도커 컴포즈 설정에 맞춰 수정)
spring.kafka.bootstrap-servers=172.35.0.11:19092, 172.35.0.12:29092, 172.35.0.13:39092

# 2. 컨슈머(수신자) 설정
# 컨슈머 그룹 ID
spring.kafka.consumer.group-id=my-delivery-group
# 초기 오프셋이 없을 때 가장 처음부터 읽기
spring.kafka.consumer.auto-offset-reset=earliest
# Key/Value 역직렬화 클래스 (문자열 기준)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# 3. 프로듀서(송신자) 설정
# Key/Value 직렬화 클래스 (문자열 기준)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer