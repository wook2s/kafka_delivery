##############################
# KRaft
##############################
process.roles=broker,controller
node.id=1

##############################
# Controller Quorum
##############################
controller.quorum.voters=1@172.35.0.11:9093,2@172.35.0.12:9093,3@172.35.0.13:9093

##############################
# Listener
##############################
listeners=INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094

inter.broker.listener.name=INTERNAL
controller.listener.names=CONTROLLER

advertised.listeners=INTERNAL://172.35.0.11:9092,EXTERNAL://127.0.0.1:19094

listener.security.protocol.map=INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT

inter.broker.listener.name=INTERNAL
controller.listener.names=CONTROLLER

##############################
# Log
##############################
log.dirs=/tmp/kafka-logs

##############################
# Topic Default
##############################
num.partitions=3
default.replication.factor=3

##############################
# Internal Topics
##############################
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2
min.insync.replicas=2

##############################
# Auto Topic Create (개발용)
##############################
auto.create.topics.enable=true
